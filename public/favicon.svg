<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tictos-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B600A8" />
      <stop offset="50%" stop-color="#8E14B8" />
      <stop offset="100%" stop-color="#551599" />
    </linearGradient>
    <linearGradient id="tictos-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B600A8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#B600A8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle with Shadow & Glow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0C0D12" stroke="#252836" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Subtle Inner Gradient Fill -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#tictos-grad)" opacity="0.15" />
  <rect x="40" y="40" width="432" height="216" rx="104" fill="url(#tictos-glow)" />

  <!-- Accent Tech Dot (Top Right) -->
  <circle cx="390" cy="122" r="22" fill="#10B981" />
  <circle cx="390" cy="122" r="32" stroke="#10B981" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Stylized Monogram "T" for tictos -->
  <g fill="url(#tictos-grad)">
    <!-- Top Bar -->
    <rect x="116" y="128" width="280" height="64" rx="20" />
    
    <!-- Vertical Stem with sleek cut / taper -->
    <path d="M 224 176 L 288 176 L 288 344 C 288 376 264 400 232 400 L 208 400 C 180 400 160 380 160 352 L 160 348 C 160 330 174 316 192 316 L 224 316 Z" />
  </g>

  <!-- Clean Inner Highlights -->
  <rect x="132" y="140" width="248" height="12" rx="6" fill="#ffffff" opacity="0.35" />
</svg>
